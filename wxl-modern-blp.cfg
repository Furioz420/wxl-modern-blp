# Maximum edges exposed for modern BLPs that already contain a usable mip chain.
# Keep Interface art at 1024 for readable text and frames. World, creature,
# spell and item textures use 512 because the 3.3.5 client has a 4 GB address
# ceiling and dense cities otherwise retain hundreds of full 1024 mip chains.
# Encoding-3 BGRA textures are also converted to DXT5.
WXL_BLP_INTERFACE_MAX_EDGE=1024

# Loading screens are short-lived full-screen art. Preserve their authored
# 2048 top mip instead of applying the persistent world-texture budget.
WXL_BLP_LOADING_SCREEN_MAX_EDGE=2048
WXL_BLP_WORLD_MAX_EDGE=512

# Character equipment components are combined by the legacy skin compositor,
# which requires paletted BLP data rather than ordinary DXT textures.
WXL_BLP_COMPONENT_MAX_EDGE=512

# Wrath renders rain with a 2x-modulate blend. Modern rain textures carry
# black RGB beneath alpha, which otherwise appears as black geometry.
# This affects only RainDrop01 and RainDropSplash01; set to 0 for pass-through.
WXL_BLP_RAIN_MODULATE=1
